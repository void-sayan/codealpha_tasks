<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | CodeAlphaStore</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">CodeAlphaStore</a><button class="nav-toggle">☰</button><nav class="nav-links"></nav></div></header><main class="container section"><h1>Checkout</h1><div class="checkout-layout"><form id="checkout-form" class="card form-card" style="width:auto;margin:0"><h2>Shipping information</h2><div class="form-group"><label>Full name</label><input name="fullName" required></div><div class="form-group"><label>Address</label><textarea name="address" required></textarea></div><div class="form-group"><label>City</label><input name="city" required></div><div class="form-group"><label>Postal code</label><input name="postalCode" required></div><p id="form-message" class="form-error"></p><button class="btn btn-primary full">Place order</button></form><aside class="card summary"><h2>Order summary</h2><div id="checkout-summary"></div></aside></div></main><script src="js/main.js"></script><script src="js/checkout.js"></script></body></html>
