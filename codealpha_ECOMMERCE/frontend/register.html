<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | CodeAlphaStore</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">CodeAlphaStore</a><nav class="nav-links"></nav></div></header><main class="container"><section class="card form-card"><h1>Create your account</h1><form id="auth-form" data-mode="register"><div class="form-group"><label for="name">Name</label><input id="name" name="name" required minlength="2"></div><div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" required></div><div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" minlength="6" required></div><div class="form-group"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="6" required></div><p id="form-message" class="form-error"></p><button class="btn btn-primary full">Register</button></form><p class="muted">Already registered? <a href="login.html">Log in</a></p></section></main><script src="js/main.js"></script><script src="js/auth.js"></script></body></html>
