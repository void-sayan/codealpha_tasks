<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin dashboard | CodeAlphaStore</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="site-header"><div class="container nav"><a class="logo" href="index.html">CodeAlphaStore</a><button class="nav-toggle" aria-label="Toggle menu">☰</button><nav class="nav-links"></nav></div></header>
<main class="container section"><div class="admin-toolbar"><div><p class="muted">Administration</p><h1>Store dashboard</h1></div><button id="logout-button" class="btn btn-secondary">Log out</button></div>
<p id="admin-message" class="admin-message form-error"></p>
<div class="admin-grid"><section class="card form-card" style="width:auto;margin:0"><h2 id="product-form-title">Add a product</h2><form id="product-form"><input type="hidden" name="id"><div class="form-group"><label for="product-name">Name</label><input id="product-name" name="name" required maxlength="160"></div><div class="form-group"><label for="product-description">Description</label><textarea id="product-description" name="description" required maxlength="5000"></textarea></div><div class="form-group"><label for="product-price">Price</label><input id="product-price" name="price" type="number" min="0" step="0.01" required></div><div class="form-group"><label for="product-category">Category</label><input id="product-category" name="category" required maxlength="80"></div><div class="form-group"><label for="product-stock">Stock</label><input id="product-stock" name="stock" type="number" min="0" step="1" required></div><div class="form-group"><label for="product-image">Image URL</label><input id="product-image" name="image" type="url"></div><div class="actions"><button class="btn btn-primary" type="submit">Save product</button><button class="btn btn-secondary" id="cancel-edit" type="button" hidden>Cancel edit</button></div></form></section>
<section><div class="card summary"><h2>Products</h2><div id="products-table" class="admin-table-wrap"><div class="loading">Loading products...</div></div></div><div class="card summary" style="margin-top:1.3rem"><h2>Orders</h2><div id="orders-table" class="admin-table-wrap"><div class="loading">Loading orders...</div></div></div></section></div></main>
<script src="js/main.js"></script><script src="js/admin.js"></script></body></html>
